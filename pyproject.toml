[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pipeline"
version = "0.1.0"
description = "Self-Healing Data Pipeline Agent: detect, diagnose, fix, validate, deploy, monitor, rollback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BibekP" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "SQLAlchemy>=2.0",
    "polars>=1.42",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "orjson>=3.10",
    "openai>=1.51",
]

